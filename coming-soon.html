<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow">
	<title>TechFiyr | Coming Soon</title>
	<link rel="icon" href="assets/images/favicon.png" type="image/png">
	<style>
		:root {
			color-scheme: dark;
			--ink: #f5f8f4;
			--muted: #aebbb2;
			--green: #237a57;
			--lime: #c6e45a;
			--night: #07110b;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			min-height: 100%;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			overflow: hidden;
			padding: 32px;
			color: var(--ink);
			background:
				radial-gradient(circle at 18% 12%, rgba(35, 122, 87, .38), transparent 34rem),
				radial-gradient(circle at 86% 86%, rgba(198, 228, 90, .16), transparent 30rem),
				var(--night);
			font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}

		body::before {
			content: "";
			position: fixed;
			inset: 0;
			pointer-events: none;
			opacity: .28;
			background-image:
				linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
				linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
			background-size: 56px 56px;
			mask-image: linear-gradient(to bottom, black, transparent 88%);
		}

		main {
			position: relative;
			z-index: 1;
			width: min(760px, 100%);
			text-align: center;
		}

		.logo {
			display: block;
			width: 190px;
			max-width: 52vw;
			height: auto;
			margin: 0 auto 56px;
		}

		.status {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			padding: 9px 15px;
			border: 1px solid rgba(198, 228, 90, .24);
			border-radius: 999px;
			background: rgba(198, 228, 90, .07);
			color: #dcec9f;
			font-size: 12px;
			font-weight: 750;
			letter-spacing: .12em;
			text-transform: uppercase;
		}

		.status::before {
			content: "";
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: var(--lime);
			box-shadow: 0 0 18px var(--lime);
		}

		h1 {
			margin: 30px 0 20px;
			font-size: clamp(58px, 11vw, 112px);
			line-height: .92;
			letter-spacing: -.07em;
		}

		h1 span {
			color: transparent;
			background: linear-gradient(110deg, var(--lime), #63c68d);
			background-clip: text;
			-webkit-background-clip: text;
		}

		p {
			max-width: 590px;
			margin: 0 auto;
			color: var(--muted);
			font-size: clamp(17px, 2.3vw, 21px);
			line-height: 1.7;
		}

		footer {
			position: fixed;
			bottom: 25px;
			left: 0;
			right: 0;
			color: rgba(255, 255, 255, .42);
			text-align: center;
			font-size: 12px;
		}

		@media (max-height: 620px) {
			.logo {
				margin-bottom: 28px;
			}

			footer {
				display: none;
			}
		}
	</style>
</head>

<body>
	<main>
		<img class="logo" src="/assets/images/logo-white.svg" alt="TechFiyr">
		<div class="status">Something new is taking shape</div>
		<h1>Coming <span>Soon.</span></h1>
		<p>We’re creating a sharper digital experience for TechFiyr. Please check back soon.</p>
	</main>
	<footer>&copy; 2026 TechFiyr. All rights reserved.</footer>
</body>

</html>
