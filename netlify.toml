# Netlify configuration.
# The site is a Next.js app (app/, components/, lib/). Netlify detects Next.js and runs it with its
# Next.js runtime; every page is prerendered at build time and served from the CDN.
# The build first writes public/firebase-config.js from environment variables (scripts/build-config.mjs,
# run by "prebuild"), and netlify/functions holds the visitor-counter API. Environment variables:
# AGENTS.md, section 7.6.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# ---------------------------------------------------------------------------
# Old .html addresses (before the Next.js move) keep working: permanent redirects to the clean URLs,
# so search engines move their index and links from other sites keep their value.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/project.html"
  query = { p = ":slug" }
  to = "/projects/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/project"
  query = { p = ":slug" }
  to = "/projects/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/project.html"
  to = "/projects"
  status = 301
  force = true

[[redirects]]
  from = "/projects.html"
  to = "/projects"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/privacy-policy.html"
  to = "/privacy-policy"
  status = 301
  force = true

[[redirects]]
  from = "/cookie-policy.html"
  to = "/cookie-policy"
  status = 301
  force = true

[[redirects]]
  from = "/content-policy.html"
  to = "/content-policy"
  status = 301
  force = true

[[redirects]]
  from = "/coming-soon.html"
  to = "/coming-soon"
  status = 301
  force = true

[[redirects]]
  from = "/404.html"
  to = "/"
  status = 301
  force = true

# Short addresses for the discovery files
[[redirects]]
  from = "/llms"
  to = "/llms.txt"
  status = 200
  force = true

[[redirects]]
  from = "/robots"
  to = "/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap"
  to = "/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap/"
  to = "/sitemap.xml"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Response headers
# ---------------------------------------------------------------------------

# Template files: links carry ?v=... (ASSET_VERSION in lib/site.ts), so they can be cached for a year.
# Images have no version: give a changed image a new file name, or visitors keep the old one.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker and manifest must update quickly
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Discovery files for search engines and AI crawlers: short cache so updates are picked up quickly
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/security.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Placeholder and utility pages stay out of search results
[[headers]]
  for = "/coming-soon"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/offline"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/__forms.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Generated at build time; must never be cached for long so env changes show up straight away
[[headers]]
  for = "/firebase-config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
