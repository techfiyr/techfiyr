# Netlify configuration.
# public/ is the website as visitors see it. The build command only writes
# public/firebase-config.js from environment variables (scripts/build-config.mjs), and
# netlify/functions holds the visitor-counter API. Environment variables: AGENTS.md, section 7.6.

[build]
  publish = "public"
  command = "node scripts/build-config.mjs"

[functions]
  directory = "netlify/functions"
